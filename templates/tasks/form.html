{% extends "base.html" %}

{% block title %}{{ 'Edit' if task_type else 'Add' }} Task Type - BuildCore Infrastructure{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">{{ 'Edit' if task_type else 'Add New' }} Task Type</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('tasks.list_tasks') }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Tasks
        </a>
    </div>
</div>

<div class="card shadow-sm col-md-8 mx-auto">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="task_name" class="form-label">Task Name</label>
                <input type="text" class="form-control" id="task_name" name="task_name"
                    value="{{ task_type.task_name if task_type else '' }}" required
                    placeholder="e.g. Foundation, Brickwork, Painting">
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="3"
                    placeholder="Describe this type of construction activity">{{ task_type.description if task_type else '' }}</textarea>
            </div>

            <hr>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary">{{ 'Save Changes' if task_type else 'Create Task Type' }}</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
