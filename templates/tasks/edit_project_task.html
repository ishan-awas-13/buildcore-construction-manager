{% extends "base.html" %}

{% block title %}Edit {{ pt.task_name }} in {{ pt.project_name }} - BuildCore Infrastructure{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Edit Project Task</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <a href="{{ url_for('tasks.view_task', task_type_id=pt.task_type_id) }}" class="btn btn-sm btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Back to Task Type
        </a>
    </div>
</div>

<div class="card shadow-sm col-md-8 mx-auto">
    <div class="card-header bg-light">
        <h5 class="mb-0">{{ pt.task_name }} — {{ pt.project_name }}</h5>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label for="description" class="form-label">Description (project-specific)</label>
                <textarea class="form-control" id="description" name="description" rows="2">{{ pt.description or '' }}</textarea>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="start_date" class="form-label">Start Date</label>
                    <input type="date" class="form-control" id="start_date" name="start_date"
                        value="{{ pt.start_date }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="due_date" class="form-label">Due Date</label>
                    <input type="date" class="form-control" id="due_date" name="due_date"
                        value="{{ pt.due_date }}" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status" required>
                        <option value="Not Started" {% if pt.status == 'Not Started' %}selected{% endif %}>Not Started</option>
                        <option value="In Progress" {% if pt.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                        <option value="Completed" {% if pt.status == 'Completed' %}selected{% endif %}>Completed</option>
                        <option value="On Hold" {% if pt.status == 'On Hold' %}selected{% endif %}>On Hold</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="completion_percentage" class="form-label">Completion (%)</label>
                    <input type="number" step="0.01" min="0" max="100" class="form-control" id="completion_percentage"
                        name="completion_percentage" value="{{ pt.completion_percentage }}" required>
                </div>
            </div>

            <hr>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
