{% extends "base.html" %}

{% block title %}Sign In - BuildCore Infrastructure{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4 overflow-hidden">
            <div class="p-4 text-center text-white" style="background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);">
                <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-25 mb-3 shadow-sm">
                    <img src="{{ url_for('static', filename='images/building_favicon.svg') }}" alt="BuildCore" style="width: 38px; height: 38px; filter: brightness(0) invert(1);">
                </div>
                <h3 class="fw-bold mb-1">BuildCore Enterprise</h3>
                <p class="small text-white-50 mb-0">Construction Management & Cost Accounting</p>
            </div>
            <div class="card-body p-4 bg-white">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-bold text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin" required autofocus>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 shadow-sm fw-bold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                    </button>
                </form>
            </div>
            <div class="card-footer bg-light border-0 py-3 text-center small text-muted">
                Academic Project &bull; Built with Flask &amp; PostgreSQL
            </div>
        </div>
    </div>
</div>
{% endblock %}
