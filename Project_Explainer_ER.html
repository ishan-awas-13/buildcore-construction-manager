# BuildCore Infrastructure - Project Documentation

## 1. Project Overview

**BuildCore Infrastructure** is a comprehensive, web-based database management system designed specifically for construction resource management. It allows construction managers to track multiple massive infrastructure projects simultaneously, ensuring that all moving parts—workers, heavy equipment, raw materials, and suppliers—are efficiently allocated and monitored.

The system is built to replace error-prone spreadsheets with a robust, dynamically validated PostgreSQL database accessed through a modern, responsive web application.

## 2. Technical Architecture

- **Backend Framework**: Flask (Python)
- **Database System**: PostgreSQL (relational database)
- **Database Interface**: SQLAlchemy (using raw SQL execution via `text()` to demonstrate advanced database concepts)
- **Frontend**: HTML5, CSS3, Bootstrap 5, Jinja2 Templating
- **Authentication**: Flask-Login and Werkzeug (Password Hashing)

## 3. Core Modules Explained

### 🏗️ Projects
The core entity of the application. Everything revolves around Projects. Projects have metadata like client name, location, expected dates, and an overarching budget. The system uses advanced SQL views to automatically calculate the completion percentage of a project based on the average completion of its underlying tasks.

### 📋 Tasks (Dynamic Architecture)
Instead of hardcoding tasks for every project, the system uses a **Reusable Task Architecture**:
1. **Task Types**: A library of standard construction activities (e.g., "Foundation Pouring", "Electrical Wiring").
2. **Project Tasks**: When a *Task Type* is assigned to a *Project*, it becomes a *Project Task* with specific start dates, due dates, statuses, and completion percentages.

### 👷 Workers & 🚜 Equipment (Dynamic Resource Allocation)
Workers and heavy machinery are managed intelligently. 
Instead of a simple "status" text field that requires manual updating (which causes data inconsistency), the system uses **SQL Views** (`worker_status_view` and `equipment_status_view`).
- A worker is marked as **"Assigned"** dynamically if they have an active record in the `task_workers` table linked to an ongoing task.
- Equipment is marked as **"In Use"** if today's date falls between the start and end dates of an active `equipment_assignment`.
- Resources are allocated strictly to specific **Project Tasks** rather than the overarching project, allowing for granular tracking of who is doing what, and when.

### 🧱 Materials
Raw materials are tracked in a central registry containing unit costs and minimum stock thresholds. Through the **Material Usage** junction table, materials are allocated to specific projects. The system tracks both how much material was *allocated* versus how much was actually *used*, dynamically calculating remaining amounts and estimated costs on the fly.

### 🚚 Suppliers, Purchases, & Expenses
The procurement pipeline tracking (To be implemented). Suppliers provide materials via **Purchases**. These purchases consist of multiple **Purchase Items** (specific materials and quantities). Additionally, overarching **Expenses** (like permits, structural tests, or legal fees) are tracked directly against a project to monitor the total burn rate against the project budget.

## 4. Advanced Database Concepts Utilized

This project heavily leverages advanced DBMS features to maintain absolute data integrity at the database level, rather than relying solely on Python logic.

- **ON DELETE CASCADE**: Ensuring that deleting a Project cleanly wipes all related tasks, assignments, and allocations without leaving orphaned data.
- **CHECK Constraints**: Guaranteeing that budgets, hourly rates, and hours used cannot mathematically fall below zero. It also guarantees that `end_date` must logically come after `start_date`.
- **Computed SQL Views**: Offloading the calculation of overall project progress, worker availability, and total purchase costs to the database engine for maximum efficiency and accuracy.
- **Many-to-Many Relationships**: Extensively using junction tables to handle complex real-world relationships (e.g., a single project uses many materials, and a single material is used across many projects).

## 5. Quick Reference: Database Relationships

To help you review the database design at a glance, here is an explicit list of the structural relationships between the tables.

### Many-to-Many Relationships
These relationships are facilitated by dedicated **Junction Tables**:
- **Projects <-> Task Types**: Mediated by `project_tasks`. (A project has many tasks, and a standard task type is used in many projects).
- **Project Tasks <-> Workers**: Mediated by `task_workers`. (A specific task requires many workers, and a worker can be assigned to many tasks).
- **Project Tasks <-> Equipment**: Mediated by `equipment_assignments`. (A specific task requires many machines, and a machine can be assigned to many tasks over time).
- **Projects <-> Materials**: Mediated by `material_usage`. (A project consumes many raw materials, and a specific material is used across many projects).
- **Projects <-> Workers (Macro Level)**: Mediated by `project_workers`. (A project has a general pool of workers, and a worker is on the roster for many projects).
- **Purchases <-> Materials**: Mediated by `purchase_items`. (A single purchase order contains many materials, and a specific material is bought in many different purchase orders).

### One-to-Many Relationships
- **Suppliers -> Purchases**: One supplier can fulfill many purchase orders, but each purchase order goes to exactly one supplier.
- **Projects -> Purchases**: One project can require many purchase orders, but each purchase order is billed to exactly one project.
- **Projects -> Expenses**: One project incurs many generalized expenses, but each expense record belongs to exactly one project.

*(Note: There are currently no strict **One-to-One** relationships in this schema, as resources in construction inherently scale in a one-to-many or many-to-many fashion).*
